<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알록달록 비행기 모험</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #gameCanvas {
            border: 4px solid #fff;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            cursor: none;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 게임 상태
let score = 0;
let frameCount = 0;

// 내 비행기 (플레이어)
const player = {
    x: canvas.width / 2,
    y: canvas.height - 80,
    width: 40,
    height: 40,
    color: '#FF4500'
};

// 마우스/터치 위치 추적
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    player.x = e.clientX - rect.left;
    player.y = e.clientY - rect.top;
});

canvas.addEventListener('touchmove', (e) => {
    const rect = canvas.getBoundingClientRect();
    player.x = e.touches[0].clientX - rect.left;
    player.y = e.touches[0].clientY - rect.top;
    e.preventDefault();
}, { passive: false });

// 배열 관리
let bullets = [];
let enemies = [];
let items = [];
let effects = [];

// 적 비행기 생성
function spawnEnemy() {
    const colors = ['#FF69B4', '#BA55D3', '#3CB371', '#FFA500'];
    enemies.push({
        x: Math.random() * (canvas.width - 30) + 15,
        y: -30,
        width: 30,
        height: 30,
        speed: 1.5 + Math.random() * 1.5,
        color: colors[Math.floor(Math.random() * colors.length)]
    });
}

// 아이템(별) 생성
function spawnItem(x, y) {
    items.push({ x, y, radius: 10, speed: 1.5 });
}

// 효과 애니메이션 (충돌 효과)
function addEffect(x, y, text) {
    effects.push({ x, y, text, opacity: 1.0 });
}

// 게임 업데이트
function update() {
    frameCount++;

    // 총알 자동 발사 (10프레임마다)
    if (frameCount % 10 === 0) {
        bullets.push({ x: player.x, y: player.y - 20, speed: 7 });
    }

    // 적 생성 (50프레임마다)
    if (frameCount % 50 === 0) {
        spawnEnemy();
    }

    // 총알 이동
    bullets.forEach((bullet, index) => {
        bullet.y -= bullet.speed;
        if (bullet.y < 0) bullets.splice(index, 1);
    });

    // 적 이동 및 충돌
    enemies.forEach((enemy, eIndex) => {
        enemy.y += enemy.speed;

        // 적이 화면 아래로 내려감
        if (enemy.y > canvas.height + 30) {
            enemies.splice(eIndex, 1);
        }

        // 총알과 적 충돌 처리
        bullets.forEach((bullet, bIndex) => {
            const dist = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
            if (dist < enemy.width / 2 + 5) {
                score += 10;
                addEffect(enemy.x, enemy.y, "팡!");
                spawnItem(enemy.x, enemy.y);
                enemies.splice(eIndex, 1);
                bullets.splice(bIndex, 1);
            }
        });

        // 플레이어와 적 충돌 (게임오버 없음, 효과음 대신 감정 표현)
        const playerDist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
        if (playerDist < player.width / 2 + enemy.width / 2) {
            addEffect(enemy.x, enemy.y, "안녕!");
            enemies.splice(eIndex, 1);
        }
    });

    // 아이템 획득 처리
    items.forEach((item, index) => {
        item.y += item.speed;
        const dist = Math.hypot(player.x - item.x, player.y - item.y);
        if (dist < player.width / 2 + item.radius) {
            score += 50;
            addEffect(item.x, item.y, "+50");
            items.splice(index, 1);
        } else if (item.y > canvas.height + 20) {
            items.splice(index, 1);
        }
    });

    // 효과 업데이트
    effects.forEach((eff, index) => {
        eff.y -= 0.5;
        eff.opacity -= 0.02;
        if (eff.opacity <= 0) effects.splice(index, 1);
    });
}

// 그려주기
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 배경 구름
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc((frameCount * 0.5) % (canvas.width + 100) - 50, 100, 30, 0, Math.PI * 2);
    ctx.arc((frameCount * 0.3 + 150) % (canvas.width + 100) - 50, 300, 40, 0, Math.PI * 2);
    ctx.fill();

    // 총알 그리기
    ctx.fillStyle = '#FFD700';
    bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 5, 0, Math.PI * 2);
        ctx.fill();
    });

    // 적 비행기 그리기
    enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.width / 2, 0, Math.PI * 2);
        ctx.fill();
    });

    // 별 아이템 그리기
    items.forEach(item => {
        ctx.fillStyle = '#FF1493';
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    // 내 비행기 그리기
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.moveTo(player.x, player.y - player.height / 2);
    ctx.lineTo(player.x - player.width / 2, player.y + player.height / 2);
    ctx.lineTo(player.x + player.width / 2, player.y + player.height / 2);
    ctx.closePath();
    ctx.fill();

    // 효과 텍스트 출력
    effects.forEach(eff => {
        ctx.fillStyle = `rgba(255, 255, 255, ${eff.opacity})`;
        ctx.font = 'bold 16px Arial';
        ctx.fillText(eff.text, eff.x - 10, eff.y);
    });

    // 점수 표시
    ctx.fillStyle = '#333';
    ctx.font = 'bold 22px Arial';
    ctx.fillText(`점수: ${score}`, 20, 40);
}

// 메인 루프
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
